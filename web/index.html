<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09111d">
    <title>ChunkVault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="Workspace navigation">
            <a class="brand" href="#dashboard" data-page-link="dashboard" aria-label="ChunkVault dashboard">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 40 40" fill="none"><path d="M20 4.8 33.2 12v16L20 35.2 6.8 28V12L20 4.8Z" stroke="currentColor" stroke-width="1.5"/><path d="m20 4.8 13.2 7.3L20 19.4 6.8 12.1M20 19.4v15.8m0-15.8 13.2-7.3M13.4 15.7v8.6l6.6 3.6 6.6-3.6v-8.6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                </span>
                <span class="brand-copy"><strong>ChunkVault</strong><small>Storage console</small></span>
            </a>

            <div class="sidebar-label">WORKSPACE</div>
            <nav id="navigation" class="nav-list" aria-label="Main navigation">
                <button class="nav-item active" type="button" data-page="dashboard" aria-current="page">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><rect x="2.5" y="2.5" width="6" height="6" rx="1"/><rect x="11.5" y="2.5" width="6" height="4" rx="1"/><rect x="11.5" y="9.5" width="6" height="8" rx="1"/><rect x="2.5" y="11.5" width="6" height="6" rx="1"/></svg></span>
                    <span>Dashboard</span>
                </button>
                <button class="nav-item" type="button" data-page="storage">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M3 5.5h5l1.6 1.8H17v7.2a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5v-9Z"/><path d="M3 8h14"/></svg></span>
                    <span>File Storage</span>
                </button>
                <button class="nav-item" type="button" data-page="os-simulator">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><rect x="2.5" y="3" width="15" height="14" rx="2"/><path d="M6 7h2m4 0h2M6 11h2m4 0h2M6 15h8"/></svg></span>
                    <span>OS Simulator</span>
                </button>
                <button class="nav-item" type="button" data-page="integrity">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 2.5 16 5v4.7c0 3.5-2.5 6.2-6 7.8-3.5-1.6-6-4.3-6-7.8V5l6-2.5Z"/><path d="m7.2 10 1.8 1.8 3.8-4"/></svg></span>
                    <span>Integrity &amp; Recovery</span>
                </button>
                <button class="nav-item" type="button" data-page="database">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="4.7" rx="6.5" ry="2.2"/><path d="M3.5 4.7v10.6c0 1.2 2.9 2.2 6.5 2.2s6.5-1 6.5-2.2V4.7M3.5 10c0 1.2 2.9 2.2 6.5 2.2s6.5-1 6.5-2.2"/></svg></span>
                    <span>Database &amp; Logs</span>
                </button>
            </nav>

            <div class="sidebar-spacer"></div>
        </aside>

        <main class="main-area">
            <header class="topbar">
                <div class="topbar-heading">
                    <div class="breadcrumb"><span>CHUNKVAULT</span><span class="breadcrumb-separator">/</span><span id="breadcrumb-page">OVERVIEW</span></div>
                    <h1 id="page-title">Dashboard</h1>
                </div>
            </header>

            <section id="page-content" class="page-content" aria-live="polite" aria-busy="false"></section>
            <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
        </main>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
